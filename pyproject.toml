[project]
name = "ai-virality-simulator"
version = "0.1.0"
description = "Local MVP that simulates how AI personas react to a short-form video and predicts a virality score."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "opencv-python-headless>=4.9",
    "ffmpeg-python>=0.2.0",
    "openai-whisper; platform_system != 'Windows'",
    "groq>=0.9.0",
    "tenacity>=8.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
